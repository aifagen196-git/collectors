name: job-engine collectors

# job-engine's collectors are long, sequential CLI scripts (one per ATS board,
# some using Playwright), not HTTP handlers — they don't fit a serverless
# platform's per-request duration limit. A scheduled GitHub Actions workflow
# runs them as a normal process instead, with no such limit (up to 6h/job on
# the free tier, far beyond what a run here needs).
#
# This repo is job-engine on its own (split out of the main AIFAGen repo so
# the deploy repo stays small — see main_project's git history) — so unlike
# the original version of this file, there's no `job-engine/` subdirectory
# to cd into; everything here IS the repo root.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   ANTHROPIC_API_KEY
#   ANTHROPIC_MODEL        (optional — only needed if the code has no default)
#
# Optional — ziprecruiter/monster each skip themselves cleanly with a log
# message if their own secrets are unset, so leaving these blank is safe,
# not a broken workflow:
#   ZIPRECRUITER_API_KEY
#   BRIGHTDATA_API_KEY, BRIGHTDATA_MONSTER_DATASET_ID
# See .env.example for what each of these is and where to get it.
#
# simplyhired/dice/jobright need NO secrets — all three scrape directly
# (simplyhired/dice via Playwright, jobright via plain HTTP — no browser at
# all) and are folded into `npm run all` below, same as every other source
# that doesn't need a paid account. All three now search the 13 target
# domains for real.
#
# More sources (Comeet, TeamTailor, BreezyHR, WeWorkRemotely, HackerNews,
# Jobvite, Recruitee, Pinpoint, Personio, Remotive, Kforce, BambooHR, UKG,
# Avature, iCIMS, JazzHR, Oracle, SAP, BuiltIn, DailyRemote, PostJobFree,
# RemoteOK, Web3Career, WorkingNomads, Jobicy, Jobvertise, Arbeitnow,
# Rippling, RemoteLanders, AuthenticJobs, Gem) also need no secrets and are
# folded into `npm run all` via `npm run all-new-free`. Workday runs as its
# own step below. Off the schedule (2026-11-10): Muse (public API shut down),
# HiringCafe (Cloudflare challenge; robots.txt disallows its search pages),
# SuccessFactors (SAP left it; sap.js replaces it).
#
# Indeed needs Playwright (already installed above for simplyhired/dice) but
# no API key. It's NOT folded into `npm run all` — its detail-page fetch
# relies on a slow click-through-from-search trick to dodge Cloudflare (see
# the comment at the top of collectors/indeed.js), so it's given its own
# step with `if: always()` and a timeout, same reasoning as the Workday step
# below: one fragile source shouldn't be able to block the other 43 or the
# cleanup pass.
#
# 6 more (Adzuna, Careerjet, Findwork, Jooble, JSearch, USAJobs) need a
# free-tier API key each; `npm run all-new-paid` (package.json) already
# chains all six with `|| true` after each, so a source with no key configured
# yet just skips itself instead of failing the step. Add secrets as you get
# them — an unconfigured source is a clean no-op, not a broken workflow:
#   ADZUNA_APP_ID, ADZUNA_APP_KEY   — https://developer.adzuna.com
#   CAREERJET_API_KEY               — https://www.careerjet.com/partners/api/
#   FINDWORK_API_KEY                — https://findwork.dev/developers/
#   JOOBLE_API_KEY                  — https://jooble.org/api/about
#   JSEARCH_API_KEY                 — RapidAPI (JSearch) or OpenWebNinja
#   USAJOBS_API_KEY, USAJOBS_USER_AGENT (the email you registered with)
#                                    — https://developer.usajobs.gov
#
# Adjust the schedule below to taste; every 6 hours is a starting point, not
# a measured requirement.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
      ZIPRECRUITER_API_KEY: ${{ secrets.ZIPRECRUITER_API_KEY }}
      BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
      BRIGHTDATA_MONSTER_DATASET_ID: ${{ secrets.BRIGHTDATA_MONSTER_DATASET_ID }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}
      FINDWORK_API_KEY: ${{ secrets.FINDWORK_API_KEY }}
      JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
      JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
      USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
      USAJOBS_USER_AGENT: ${{ secrets.USAJOBS_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @supabase/supabase-js (see package.json) now requires Node 22+ —
          # its Realtime client needs a native WebSocket global, which Node 20
          # doesn't have. Nothing here actually uses realtime features
          # (runLog.js and runtime.js both just do plain REST calls via
          # createClient()), but supabase-js initializes its Realtime client
          # eagerly inside createClient() regardless, so it throws
          # "Node.js detected but native WebSocket not found" on Node 20
          # before any real work runs. Confirmed live: this crashed the very
          # first collector in the chain.
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # Indeed, SimplyHired and Dice all drive a real headless browser now
      # (Cloudflare/anti-bot walls on those sites need one) — install just
      # Chromium rather than every engine Playwright supports.
      - run: npx playwright install --with-deps chromium

      - name: Run all collectors
        run: npm run all

      - name: Run Indeed (isolated — slow click-through detail fetch, Cloudflare-fragile)
        # Kept out of `npm run all` on purpose (see the top-of-file comment).
        # `if: always()` and `|| true` so a block/timeout here can't stop the
        # cleanup pass or the Workday step below, same pattern as those two.
        if: always()
        run: timeout 20m npm run indeed || true

      - name: Run sources that need a paid third-party account (ziprecruiter/monster)
        # Not folded into `npm run all` — both need a paid account this repo
        # doesn't have configured yet (ZipRecruiter: pending partner
        # approval; Monster: needs a Bright Data account). Each skips itself
        # cleanly if its own secrets are unset. GitHub Actions runs a
        # multi-line `run:` under `bash -e`, so `|| true` after each line is
        # required — without it, a REAL failure in one (as opposed to its
        # own graceful unconfigured-skip, which exits 0) would stop the rest
        # of this step from running at all, exactly like chaining with `&&`
        # would.
        if: always()
        run: |
          npm run ziprecruiter || true
          npm run monster || true

      - name: Run sources that need a free-tier API key (Adzuna/Careerjet/Findwork/Jooble/JSearch/USAJobs)
        # `all-new-paid` already chains all six with `|| true` after each
        # (package.json), so any source whose secret hasn't been added yet
        # just skips itself cleanly instead of failing the step.
        if: always()
        run: npm run all-new-paid

      - name: Deactivate expired jobs and purge old inactive rows
        # Still run this even if one collector above failed partway through
        # `npm run all` (its steps are chained with &&) — a stalled ATS board
        # shouldn't also block the cleanup pass.
        if: always()
        run: npm run cleanup

      - name: Run Workday (heavy — isolated, time-boxed, best-effort)
        # Workday is NOT in `npm run all` — a single big tenant (a global
        # pharma) has thousands of postings, and workday.js fetches details
        # for every listing before filtering to US-only, so an uncapped run
        # spends 80+ minutes here and blew the whole job's 180-min timeout
        # (it was the very last collector in the chain, so 41 others had
        # already run fine — see the run from 2026-09-10). Given its own
        # step with `if: always()` it can't block the reliable collectors or
        # the cleanup above; MAX_LISTINGS_PER_COMPANY caps each tenant and
        # `timeout` hard-stops the step. `|| true` so a timeout/failure here
        # doesn't fail the whole workflow.
        if: always()
        env:
          MAX_LISTINGS_PER_COMPANY: "300"
        run: timeout 30m npm run workday || true
